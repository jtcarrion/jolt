name: docs

# Builds the documentation and publishes it with GitHub Pages on every push to main.
# One-time setup (after the repository is public): Settings -> Pages -> Source: "GitHub Actions".
# While the repository is private the deploy job is skipped; the build itself is also checked by tests.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the version shown in the docs is derived from git tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[docs]"
      - name: Build documentation (warnings are errors)
        run: sphinx-build -W --keep-going -b html docs/source docs/_build/html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}  # Pages needs a public repository (or a paid plan)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
